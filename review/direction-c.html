<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>C · Monsoon Almanac · Manipal Explorer</title>
<style>
:root{
  --ink:#0B0F0E; --deep:#0E3B3A; --teal:#1F6F6B; --saffron:#F29B38; --laterite:#B4532A; --palm:#4F7A3A; --sand:#EDE3D1; --bone:#F7F3EA;
  --bg:#0C2E2D;
  --muted:color-mix(in oklab, var(--bone) 70%, var(--deep));
  --line:rgb(247 243 234 / .16);
  --serif:'Fraunces Variable', Georgia, serif;
  --sans:'Figtree Variable', system-ui, sans-serif;
  --ease-soft:cubic-bezier(.22,1,.36,1);
  --ease-swell:cubic-bezier(.34,1.3,.64,1);
  --gutter:clamp(20px, 5vw, 64px);
  --arch:999px 999px 18px 18px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--bone);font:400 clamp(1rem,.97rem + .15vw,1.1rem)/1.6 var(--sans);overflow-x:clip;
  background:radial-gradient(90% 60% at 50% 0%, #15504c 0%, transparent 60%), var(--bg)}
img{display:block;max-width:100%;height:auto}
picture{display:block;background:var(--dominant) center/cover no-repeat}
picture img{width:100%;height:100%;object-fit:cover}
a{color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:4px;border-radius:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:600 .74rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--saffron)}
.serif{font-family:var(--serif);font-optical-sizing:auto}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--saffron)}
.orn::before,.orn::after{content:"";height:1px;width:clamp(32px,8vw,90px);background:linear-gradient(90deg,transparent,currentColor)}
.orn::after{transform:scaleX(-1)}

/* ───────── HERO ───────── */
.hero{min-height:100vh;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) var(--gutter) 48px;display:grid;grid-template-rows:auto 1fr;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:50%;top:30%;width:min(120vw,1100px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, rgb(242 155 56 / .22), transparent 60%);pointer-events:none}
.nav{display:flex;justify-content:space-between;align-items:center;position:relative}
.logo{font:500 1.25rem/1 var(--serif);font-style:italic}
.pill{display:inline-flex;align-items:center;gap:.5em;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:rgb(247 243 234 / .06);color:var(--bone);font:600 .88rem/1 var(--sans);text-decoration:none;cursor:pointer;transition:transform .5s var(--ease-swell),background .3s}
.pill:hover{transform:translateY(-2px);background:rgb(247 243 234 / .12)}
.pill--sun{background:var(--saffron);color:var(--ink);border-color:transparent}
.pill--sun:hover{background:#f6ad57}
.hero__body{position:relative;display:grid;justify-items:center;align-content:center;gap:0;padding-top:24px}
.arch{width:min(76vw,400px);aspect-ratio:3/4;border-radius:var(--arch);overflow:hidden;position:relative;box-shadow:0 40px 120px rgb(0 0 0 / .45);outline:1px solid rgb(242 155 56 / .4);outline-offset:10px}
.arch picture{position:absolute;inset:0}
.hero h1{font:300 clamp(3rem,1.6rem + 7vw,8.2rem)/.92 var(--serif);letter-spacing:-.03em;margin:-.5em 0 0;position:relative;text-wrap:balance;max-width:14ch;
  font-variation-settings:"SOFT" 100,"WONK" 1}
.hero h1 em{font-style:italic;font-weight:400;color:var(--sand)}
.hero__sub{max-width:40ch;margin:20px auto 0;color:var(--muted);font-size:1.08rem}
.dial{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;list-style:none;margin:28px 0 0;padding:0}
.dial li{min-width:40px;height:40px;border-radius:999px;display:grid;place-items:center;font:600 .74rem/1 var(--sans);color:var(--muted);border:1px solid transparent}
.dial li.now{background:var(--saffron);color:var(--ink)}
.season{margin:14px 0 0;font:400 1.15rem/1.4 var(--serif);font-style:italic}
.season b{font-style:normal;font-weight:600;color:var(--saffron)}

/* ───────── CARD ───────── */
.sec{padding:clamp(80px,14vh,160px) var(--gutter);text-align:center}
.sec h2{font:300 clamp(2.4rem,1.6rem + 3.4vw,4.6rem)/1 var(--serif);margin:14px 0 clamp(32px,6vh,64px);letter-spacing:-.02em}
.sec h2 em{font-style:italic;color:var(--saffron)}
.pair{display:grid;gap:40px;justify-items:center}
@media (min-width:860px){.pair{grid-template-columns:1fr 1fr;align-items:center;max-width:1100px;margin:0 auto;text-align:left}}
.card{width:min(100%,380px);text-align:center;background:linear-gradient(180deg,rgb(247 243 234 / .07),rgb(247 243 234 / .02));border:1px solid var(--line);border-radius:var(--arch);padding:12px 12px 24px;position:relative;transition:transform .7s var(--ease-swell)}
.card:hover{transform:translateY(-6px)}
.card__img{aspect-ratio:4/5;border-radius:999px 999px 10px 10px;overflow:hidden;position:relative}
.card__img picture{position:absolute;inset:0;transition:transform 1.2s var(--ease-soft)}
.card:hover .card__img picture{transform:scale(1.04)}
.card .star{position:absolute;right:22px;bottom:calc(24px + 46%);}
.star{width:48px;height:48px;border-radius:50%;border:0;background:var(--bone);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px rgb(0 0 0 / .3);transition:transform .5s var(--ease-swell)}
.star:active{transform:scale(.9)}
.star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.star[aria-pressed="true"]{background:var(--saffron)}.star[aria-pressed="true"] svg{fill:currentColor}
.badge{display:inline-flex;align-items:center;gap:6px;margin:20px 0 8px;padding:6px 12px;border-radius:999px;background:rgb(79 122 58 / .35);color:#cfe6bf;font:600 .74rem/1 var(--sans)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#9fd27a;box-shadow:0 0 10px #9fd27a}
.card h3{font:400 2rem/1.02 var(--serif);margin:4px 8px 8px;letter-spacing:-.01em}
.card p{margin:0 14px;color:var(--muted)}
.card .dist{display:flex;justify-content:center;gap:10px;margin-top:16px;font:500 .9rem/1 var(--sans)}
.card .dist span+span::before{content:"·";margin-right:10px;color:var(--saffron)}
.why p{font:300 clamp(1.3rem,1.1rem + .8vw,1.8rem)/1.35 var(--serif);margin:0 0 16px;max-width:30ch}
.why p em{color:var(--saffron)}
.credit,.opener .credit{font-size:.74rem;color:var(--muted)}

/* ───────── CHAPTER OPENER ───────── */
.opener{position:relative;padding:clamp(80px,16vh,180px) var(--gutter);text-align:center;overflow:hidden;background:linear-gradient(180deg,transparent,rgb(11 15 14 / .5) 60%,transparent)}
.rings{position:relative;width:min(80vw,460px);aspect-ratio:1;margin:0 auto;display:grid;place-items:center;border-radius:50%;
  background:repeating-radial-gradient(circle, transparent 0 22px, rgb(242 155 56 / .22) 22px 23px);}
.rings::before{content:"";position:absolute;inset:18%;border-radius:var(--arch);overflow:hidden}
.rings .arch2{position:absolute;inset:14% 24%;border-radius:var(--arch);overflow:hidden;outline:1px solid rgb(242 155 56 / .5);outline-offset:8px}
.rings .arch2 picture{position:absolute;inset:0}
.rings .numeral{position:absolute;bottom:-4%;font:400 clamp(4rem,3rem + 4vw,6.4rem)/1 var(--serif);font-style:italic;color:var(--saffron);text-shadow:0 10px 40px rgb(0 0 0 / .6)}
.opener h2{font:300 clamp(4rem,2rem + 10vw,12rem)/.85 var(--serif);letter-spacing:-.04em;margin:36px 0 0;font-variation-settings:"SOFT" 100,"WONK" 1}
.opener h2 em{font-style:italic}
.opener p{max-width:42ch;margin:22px auto 0;color:var(--muted);font-size:1.1rem}
.opener .count{font:400 1.2rem/1 var(--serif);font-style:italic;color:var(--sand);margin-top:22px}

/* ───────── DETAIL ───────── */
.stage{position:relative;padding:120px 0 0;overflow:hidden}
.stage__bg{position:absolute;inset:0}
.stage__bg picture{position:absolute;inset:0;filter:blur(2px) saturate(.6)}
.stage__bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(12 46 45 / .6),rgb(12 46 45 / .92))}
.sheet{position:relative;background:var(--bone);color:var(--ink);border-radius:28px 28px 0 0;padding:12px var(--gutter) max(40px,env(safe-area-inset-bottom))}
.grab{width:48px;height:5px;border-radius:3px;background:rgb(11 15 14 / .2);margin:0 auto 22px}
.sheet .eyebrow{color:var(--laterite)}
.d-layout{display:grid;gap:28px}
.d-img{aspect-ratio:4/5;border-radius:var(--arch);overflow:hidden;max-width:420px;width:100%;margin:0 auto}
.d-img picture{height:100%}
.d-head{text-align:center}
.d-head h2{font:400 clamp(2.6rem,1.8rem + 3vw,4.4rem)/.95 var(--serif);letter-spacing:-.02em;margin:12px 0 12px;font-variation-settings:"SOFT" 50}
.d-head p{font:400 1.25rem/1.4 var(--serif);font-style:italic;color:#3f4a47;margin:0 auto 20px;max-width:30ch}
.d-acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.sheet .pill{border-color:rgb(11 15 14 / .2);color:var(--ink);background:transparent}
.sheet .pill--sun{background:var(--ink);color:var(--bone);border-color:transparent}
.sheet .toggle[aria-pressed="true"]{background:var(--palm);color:var(--bone)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:28px 0 0}
.stats div{background:var(--sand);border-radius:18px;padding:16px 18px}
.stats dt{font:600 .7rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#5c5a52}
.stats dd{margin:8px 0 0;font:500 1.6rem/1.05 var(--serif)}
.stats dd small{display:block;font:500 .8rem/1.3 var(--sans);color:#5c5a52;margin-top:4px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;list-style:none;margin:12px 0 10px;padding:0}
.months li{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:600 .58rem/1 var(--sans);background:var(--sand);color:#5c5a52}
.months li.on{background:var(--teal);color:var(--bone)}
.months li.now{box-shadow:0 0 0 2px var(--bone),0 0 0 4px var(--saffron)}
.panel{background:#fff;border-radius:22px;padding:20px 22px;margin-top:12px;box-shadow:0 1px 0 rgb(11 15 14 / .06)}
.panel h3{font:500 1.35rem/1.1 var(--serif);margin:0 0 10px;font-style:italic}
.panel p{margin:0 0 8px;color:#2b302e}
.panel dl{margin:0;display:grid;gap:14px}
.panel dt{font-weight:700}.panel dd{margin:4px 0 0;color:#3a403e;font-size:.95rem}
.panel--warn{background:#FBE3D6;border:1px solid rgb(180 83 42 / .35)}
.panel--warn h3{color:#8a3a1a}
.vfy{display:inline-block;margin-left:6px;padding:3px 8px;border-radius:999px;background:#fff1de;color:#8a4a07;font:700 .62rem/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}
.src{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.src a{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;background:var(--sand);font-size:.8rem;text-decoration:none}
.sheet .credit{color:#5c5a52}
@media (min-width:1000px){
  .stage{padding:80px var(--gutter)}
  .sheet{max-width:1180px;margin:0 auto;border-radius:32px;padding:40px}
  .grab{display:none}
  .d-layout{grid-template-columns:400px 1fr;gap:48px;align-items:start}
  .d-left{position:sticky;top:40px}
  .d-head{text-align:left}.d-head p{margin-left:0}.d-acts{justify-content:flex-start}
  .stats{grid-template-columns:repeat(4,1fr)}
  .cols{columns:2;column-gap:12px}.cols .panel{break-inside:avoid;margin:0 0 12px}
}

[data-reveal]{opacity:0;transform:translateY(40px) scale(.97);transition:opacity 1s var(--ease-soft),transform 1.2s var(--ease-swell)}
[data-reveal].in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import '@fontsource-variable/fraunces/full.css';
import '@fontsource-variable/fraunces/full-italic.css';
import '@fontsource-variable/figtree';
import places from '../src/data/places.json';
import { SPEC, stats, picture, creditLine, monthStrip, isGoodNow, esc, readerSources, host, wireStars, reveals, MONTHS, thisMonth } from './directions/shared.js';

const starSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.6 6.1.7-4.5 4.2 1.2 6.1L12 16.8 6.6 19.8l1.2-6.1L3.3 9.5l6.1-.7z"/></svg>';
const c = SPEC.card, d = SPEC.detail, t = d.temple;
// Count only places with a real season (not open-all-year), so the number moves with the calendar.
const goodNow = places.filter((p) => p.bestMonths?.length < 12 && isGoodNow(p)).length;
const monthName = new Date().toLocaleString('en-GB', { month: 'long' });

document.getElementById('app').innerHTML = `
<header class="hero">
  <div class="nav"><span class="logo">Manipal Explorer</span><a class="pill" href="#">My list</a></div>
  <div class="hero__body">
    <div class="arch">${picture(SPEC.heroImg, { eager: true, sizes: '400px' })}</div>
    <h1>Coast, shrine <em>&amp;</em> <em>hill</em>, month by month</h1>
    <p class="hero__sub">An almanac for everything around Manipal and Udupi: ${stats.places} places, ${stats.trips} trips, ${stats.festivals} festivals, and a vegetarian table.</p>
    <ol class="dial" aria-label="Months">${MONTHS.map((m,i)=>`<li class="${i+1===thisMonth?'now':''}" ${i+1===thisMonth?'aria-current="date"':''}>${m}</li>`).join('')}</ol>
    <p class="season">In ${monthName}, <b>${goodNow} places</b> are in their best season.</p>
  </div>
</header>

<section class="sec" aria-labelledby="s1">
  <p class="orn eyebrow">Good right now</p>
  <h2 id="s1">This month, <em>go here</em></h2>
  <div class="pair">
    <article class="card" data-reveal>
      <div class="card__img">${picture(SPEC.cardImg, { sizes: '380px' })}</div>
      <button class="star" data-star="${c.id}" aria-label="Add ${esc(c.name)} to my list">${starSvg}</button>
      ${isGoodNow(c) ? '<span class="badge">In season</span>' : ''}
      <h3><a href="#detail" style="text-decoration:none">${esc(c.name)}</a></h3>
      <p>${esc(c.hook)}</p>
      <div class="dist"><span>${c.distanceKmFromManipal} km</span><span>${c.rideTimeFromManipal} ride</span></div>
    </article>
    <div class="why">
      <div class="eyebrow" style="margin-bottom:14px">Specimen · place card</div>
      <p>An arch, like the temple doorways it leads you to. <em>Seasons first:</em> the card tells you if now is the time before it tells you anything else.</p>
      <p class="credit" style="font:400 .74rem/1.5 var(--sans)">${creditLine(SPEC.cardImg)}</p>
    </div>
  </div>
</section>

<section class="opener" aria-labelledby="ch2">
  <p class="orn eyebrow">Chapter two</p>
  <div class="rings" style="margin-top:32px">
    <div class="arch2">${picture(SPEC.openerImg, { sizes: '300px', alt: '' })}</div>
    <span class="numeral" aria-hidden="true">II</span>
  </div>
  <h2 id="ch2"><span class="vh">Chapter II: </span>The <em>Gods</em></h2>
  <p>For every shrine: what to wear, when the doors open and where prasada is served.</p>
  <p class="count">${stats.chapter('gods')} temples, mathas &amp; peethas</p>
  <p class="credit" style="margin-top:18px">Udupi Sri Krishna Matha. ${creditLine(SPEC.openerImg)}</p>
</section>

<section class="stage" id="detail" aria-label="Place detail">
  <div class="stage__bg" aria-hidden="true">${picture(SPEC.detailImg2, { alt: '' })}</div>
  <article class="sheet" aria-labelledby="d-h">
    <div class="grab" aria-hidden="true"></div>
    <div class="d-layout">
      <div class="d-left">
        <div class="d-img">${picture(SPEC.detailImg, { sizes: '(min-width:1000px) 400px, 90vw' })}</div>
        <p class="credit" style="text-align:center;margin-top:10px">${creditLine(SPEC.detailImg)}</p>
      </div>
      <div>
        <div class="d-head">
          <span class="eyebrow">The Gods · ${d.confidence === 'verified' ? 'Verified' : 'Partly verified'}, ${d.lastChecked}</span>
          <h2 id="d-h">${esc(d.name)}</h2>
          <p>${esc(d.hook)}</p>
          <div class="d-acts"><button class="star" data-star="${d.id}" aria-label="Add ${esc(d.name)} to my list">${starSvg}</button><a class="pill pill--sun" href="https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lng}#map=14/${d.lat}/${d.lng}">Open map</a><button class="pill toggle" aria-pressed="false" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')">Been there</button></div>
        </div>
        <dl class="stats">
          <div><dt>Distance</dt><dd>${d.distanceKmFromManipal} km<small>from Manipal</small></dd></div>
          <div><dt>Ride</dt><dd>${d.rideTimeFromManipal}<small>by motorcycle</small></dd></div>
          <div><dt>Train</dt><dd style="font-size:1.05rem">${esc(d.transport.train.station)}<small>28–30 km to Kollur</small></dd></div>
          <div><dt>Go</dt><dd style="font-size:1.05rem">${esc(d.bestTime)}</dd></div>
        </dl>
        <div class="panel" style="margin-top:12px"><h3>When</h3>${monthStrip(d)}<p style="font-size:.95rem">${esc(d.seasonNote)}</p></div>
        <div class="cols">
          <div class="panel"><h3>Why go</h3><p>${esc(d.why)}</p></div>
          <div class="panel"><h3>At the temple</h3><dl>
            <div><dt>Darshan<span class="vfy">Verify locally</span></dt><dd>${esc(t.darshanTimings)}</dd></div>
            <div><dt>Dress code</dt><dd>${esc(t.dressCode)}</dd></div>
            <div><dt>Anna prasada</dt><dd>${esc(t.annadana)}</dd></div></dl></div>
          <div class="panel"><h3>The ride</h3><p>${esc(d.bikeTips)}</p></div>
          <div class="panel panel--warn"><h3>Before you go</h3><p>${esc(d.safety)}</p></div>
          <div class="panel"><h3>Sources</h3><ul class="src">${readerSources(d).map(u=>`<li><a href="${esc(u)}">${host(u)}</a></li>`).join('')}</ul></div>
        </div>
      </div>
    </div>
  </article>
</section>`;
wireStars(); reveals();
</script>
</body>
</html>
